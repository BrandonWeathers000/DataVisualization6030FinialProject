<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Track Explorer</title>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#777; --panel:#f6f7f9; --border:#d8dbe0; --field:#fbfbfc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e8e8ea; --muted:#9a9ea6; --panel:#1f2227; --border:#363a42; --field:#101215; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px 4px; }
  h1 { font-size:18px; margin:0 0 2px; }
  header p { margin:0; color:var(--muted); }
  main { display:flex; gap:16px; padding:12px 20px 20px; align-items:flex-start; flex-wrap:wrap; }
  #viz { flex:1 1 640px; min-width:0; }
  #field { width:100%; height:auto; background:var(--field); border:1px solid var(--border); border-radius:6px; display:block; }
  #controls { display:flex; align-items:center; gap:12px; margin-top:10px; }
  #controls input[type=range] { flex:1; }
  button { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  #frameLabel { min-width:90px; text-align:right; font-variant-numeric:tabular-nums; }
  aside { flex:0 0 230px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px; }
  aside h2 { font-size:14px; margin:0 0 8px; }
  .btnrow { display:flex; gap:6px; margin-bottom:8px; }
  .opt { display:block; margin-bottom:10px; color:var(--muted); }
  #trackList { max-height:520px; overflow-y:auto; }
  .group { margin-bottom:8px; }
  .group > summary { display:flex; align-items:center; gap:8px; cursor:pointer; padding:4px; font-weight:600; border-radius:4px; list-style-position:outside; }
  .group > summary:hover { background:rgba(128,128,128,.18); }
  .group .count { margin-left:auto; color:var(--muted); font-weight:400; font-size:12px; }
  .group .tracks { padding-left:18px; }
  .addcsv { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; }
  .addcsv input { width:100%; margin-top:4px; font-size:12px; }
  .track { display:flex; align-items:center; gap:8px; padding:3px 4px; border-radius:4px; cursor:pointer; }
  .track:hover, .track.hl { background:rgba(128,128,128,.18); }
  .track .sw { width:12px; height:12px; border-radius:50%; flex:none; }
  .typesw { flex:none; }
  .track .meta { margin-left:auto; color:var(--muted); font-size:12px; }
  .track.absent .name { color:var(--muted); }
  .grid line { stroke:var(--border); stroke-opacity:.5; }
  .axis text { fill:var(--muted); }
  .axis path, .axis line { stroke:var(--border); }
  .cell-label { font-size:11px; font-weight:600; paint-order:stroke; stroke:var(--field); stroke-width:3px; pointer-events:none; }
  #tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--border); padding:4px 8px; border-radius:4px; font-size:12px; opacity:0; }
  #error { color:#c0392b; padding:0 20px; }
</style>
</head>
<body>
<header>
  <h1>Cell Track Explorer</h1>
  <p>Each cell type has its own color family and marker shape. Cells of the same track share a color and are joined by a line to their earlier positions. Hover a cell or a list entry to highlight its track.</p>
</header>
<div id="error"></div>
<main>
  <section id="viz">
    <svg id="field"></svg>
    <div id="controls">
      <button id="play">▶ Play</button>
      <input id="slider" type="range" min="0" max="10" step="1" value="0" aria-label="Frame">
      <span id="frameLabel"></span>
    </div>
  </section>
  <aside>
    <h2>Cell types &amp; tracks</h2>
    <div class="btnrow"><button id="allOn">All</button><button id="allOff">None</button></div>
    <label class="opt"><input type="checkbox" id="trailToggle" checked> Show trails (previous positions)</label>
    <div id="trackList"></div>
    <label class="addcsv">Add more cell-type CSVs (name = file name)
      <input type="file" id="fileInput" accept=".csv" multiple>
    </label>
  </aside>
</main>
<div id="tip"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="source.js"></script>
</body>
</html>
